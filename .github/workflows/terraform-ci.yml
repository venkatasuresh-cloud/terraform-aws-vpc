name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize root module
        run: terraform init -backend=false

      - name: Validate root module
        run: terraform validate

      - name: Run Terraform tests
        run: terraform test -no-color

      - name: Initialize two-AZ example
        working-directory: examples/two-az
        run: terraform init -backend=false

      - name: Validate two-AZ example
        working-directory: examples/two-az
        run: terraform validate

      - name: Initialize three-AZ example
        working-directory: examples/three-az
        run: terraform init -backend=false

      - name: Validate three-AZ example
        working-directory: examples/three-az
        run: terraform validate